# 投放区 & 侦察区 (相对机头前方距离 + 航点偏移)
dropZone:
  forwardDistance: 32.5     # 机头前方距离 (m) — 投放区中心
  priority: 0               # 0=优先大桶(25cm), 1=优先小桶(15cm)

reconZone:
  forwardDistance: 55.0     # 机头前方距离 (m)
  hoverTime: 3.0            # 每航点悬停时间 (s)
  waypoints:                # 相对于侦察区中心的 NED 偏移
    - { north:  0.0, east:  0.0 }
    - { north: -2.0, east:  1.5 }
    - { north:  2.0, east:  1.5 }
    - { north:  2.0, east: -1.5 }
    - { north: -2.0, east: -1.5 }

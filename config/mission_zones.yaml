# 投放区 & 侦察区 (相对机头前方距离 + 航点偏移)
dropZone:
  forwardDistance: 32.5     # 机头前方距离 (m) — 投放区中心
  priority: 0               # 0=优先大桶(25cm), 1=优先小桶(15cm)

reconZone:
  forwardDistance: 57.5     # 机头前方距离 (m) — 侦察区中心 (近边55m + 半长2.5m)
  hoverTime: 1.0            # 每航点悬停时间 (s)
  waypoints:                # 相对侦察区中心的 NED 偏移 (5m高度覆盖5m北×8m东, 已补偿CX/CY偏置与相机前移0.088m)
    - { north: -0.79, east: 0.32 }
    - { north: -0.79, east: 0.43 }
    - { north:  0.37, east: 0.43 }
    - { north:  0.37, east: 0.32 }
